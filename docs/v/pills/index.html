<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boston, pills</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600&display=swap">
<style>
:root { --paper: #f4f1ea; --ink: #141414; --soft: #6b6b66; --card: #fbfaf7; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font: 15px/1.45 "Schibsted Grotesk", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
#app { position: fixed; inset: 0; display: grid; grid-template-columns: 400px 1fr; }
#panel { background: var(--card); overflow-y: auto; padding: 24px 24px 40px; }
#map { position: relative; background: var(--paper); }
.leaflet-container { background: var(--paper); font: inherit; }
.leaflet-control-attribution { background: none; color: var(--soft); font-size: 11px; }
.leaflet-control-attribution a { color: var(--soft); }
.leaflet-control-zoom { border: 0 !important; box-shadow: 0 2px 10px rgba(0,0,0,.12); border-radius: 12px; overflow: hidden; }
.leaflet-control-zoom a { background: #fff; color: var(--ink); border: 0 !important; width: 36px; height: 36px; line-height: 36px; }

/* top bar on the map, like a search bar */
#top { position: absolute; z-index: 800; top: 16px; left: 16px; right: 16px; display: flex; gap: 8px; align-items: center; background: #fff; border-radius: 999px; box-shadow: 0 4px 18px rgba(0,0,0,.12); padding: 6px 8px 6px 14px; }
#top .trip { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
#top .trip small { color: var(--soft); font-weight: 400; margin-left: 8px; }
#days { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
#days::-webkit-scrollbar { display: none; }
#days button { flex: none; border: 0; background: none; color: var(--ink); font: inherit; font-size: 13px; padding: 8px 12px; border-radius: 999px; cursor: pointer; }
#days button[aria-pressed="true"] { background: var(--ink); color: #fff; }

/* pills on the map */
.pillwrap { position: relative; width: 0; height: 0; }
.pill { position: absolute; left: 0; bottom: 6px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; }
.pill .tag { background: #fff; border-radius: 999px; padding: 3px 9px; font-size: 11px; color: var(--soft); white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,.14); }
.pill .name { background: #fff; border-radius: 999px; padding: 7px 13px; font-size: 13px; font-weight: 500; white-space: nowrap; box-shadow: 0 3px 12px rgba(0,0,0,.18); }
.pill.on .name { background: var(--ink); color: #fff; }
.pill.on .tag { background: var(--ink); color: #fff; }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 3px #fff; }
.pill.lodge .name { font-weight: 400; color: var(--soft); }
.pill.lodge .dot { background: var(--soft); }
.pill.hide .name, .pill.hide .tag { display: none; }

/* panel */
h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; letter-spacing: 0; }
.sentence { color: var(--soft); margin: 0 0 22px; }
.spend { margin: 0 0 22px; font-size: 13px; color: var(--soft); }
ol { list-style: none; margin: 0; padding: 0; }
ol li { display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: baseline; padding: 11px 0; cursor: pointer; }
ol li .t { color: var(--soft); font-variant-numeric: tabular-nums; font-size: 13px; }
ol li .n { font-weight: 500; }
ol li .leg { grid-column: 2 / 4; color: var(--soft); font-size: 13px; margin-top: -2px; }
ol li .c { color: var(--soft); font-size: 13px; white-space: nowrap; }
ol li[aria-current="true"] .n { text-decoration: underline; text-underline-offset: 3px; }
#detail { margin: 0 0 14px; padding: 18px; background: #fff; border-radius: 18px; box-shadow: 0 6px 24px rgba(0,0,0,.08); }
#detail:empty { display: none; }
#detail .meta { color: var(--soft); font-size: 13px; margin: 0 0 8px; }
#detail h2 { font-size: 18px; font-weight: 600; margin: 0 0 8px; }
#detail p { margin: 0 0 10px; }
#detail a { color: var(--ink); }
#detail .close { float: right; border: 0; background: var(--paper); border-radius: 999px; width: 30px; height: 30px; cursor: pointer; font: inherit; }

/* phone: map full screen, bottom sheet */
@media (max-width: 760px) {
  #app { grid-template-columns: 1fr; }
  #map { position: fixed; inset: 0; }
  #panel { position: fixed; left: 0; right: 0; bottom: 0; top: auto; height: 42vh; border-radius: 22px 22px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.12); padding: 10px 16px 32px; transition: height .25s ease; z-index: 900; touch-action: pan-y; }
  #panel.tall { height: 82vh; }
  #panel .grip { width: 40px; height: 4px; border-radius: 2px; background: #d8d5cc; margin: 0 auto 14px; }
  h1 { font-size: 19px; }
  #panel.sel h1, #panel.sel .sentence, #panel.sel .spend { display: none; }
  #top { top: 12px; left: 12px; right: 12px; padding-left: 12px; }
  #top .trip { display: none; }
  .leaflet-top.leaflet-left { top: 72px; }
  .leaflet-control-attribution { display: none; }
  .leaflet-control-zoom { display: none; }
}
@media (min-width: 761px) { #panel .grip { display: none; } }
</style>
</head>

    <div class="grip"></div>
    <h1 id="title"></h1>
    <p class="sentence" id="sentence"></p>
    <p class="spend" id="spend"></p>
    <div id="detail"></div>
    <ol id="list"></ol>
  </aside>
  <div id="map">

function layoutPills() {
  const boxes = [];
  const els = [...document.querySelectorAll('.pill')].sort((a, b) => (b.classList.contains('on') ? 1 : 0) - (a.classList.contains('on') ? 1 : 0));
  els.forEach(el => {
    el.classList.remove('hide');
    const r = el.getBoundingClientRect(), box = [r.left - 4, r.top - 4, r.right + 4, r.bottom + 4];
    const clash = boxes.some(b => !(box[2] < b[0] || box[0] > b[2] || box[3] < b[1] || box[1] > b[3]));
    if (clash && !el.classList.contains('on')) el.classList.add('hide'); else boxes.push(box);
  });
}
map.on('zoomend moveend', layoutPills);

/* panel */
function render() {
  const day = SEED.days[dayIdx];
  F('days').innerHTML = SEED.days.map((d, i) => `<button type="button" aria-pressed="${i === dayIdx}" data-day="${i}">${DAY_NAMES[i]} ${+d.date.slice(8)}</button>`).join('');
  F('title').textContent = day.title.replace(/^\w+ \w+ \d+: /, '').replace(/^./, c => c.toUpperCase());
  F('sentence').textContent = day.stops.map(s => `${s.time || ''} ${place(s.name)}`.trim()).join(', ') + '.';
  F('spend').textContent = day.spend ? `Spend ${day.spend}` : '';
  F('list').innerHTML = day.stops.map(s => `<li data-id="${esc(s.id)}"${s.id === selected ? ' aria-current="true"' : ''}><span class="t">${esc(s.time || '')}</span><span class="n">${esc(place(s.name))}</span><span class="c">${esc(shortMoney(s))}</span>${s.legToNext && s.legToNext.text ? `<span class="leg">then ${esc(s.legToNext.text)}</span>` : ''}</li>`).join('');
  const s = day.stops.find(x => x.id === selected);
  F('panel').classList.toggle('sel', !!s);
  F('detail').innerHTML = s ? `<button type="button" class="close" aria-label="Close">×</button><p class="meta">${esc(s.time || '')} · ${esc(money(s))}${s.legToNext && s.legToNext.text ? ` · then ${esc(s.legToNext.text)}` : ''}</p><h2>${esc(s.name)}</h2>${s.why ? `<p>${esc(s.why)}</p>` : ''}${s.address ? `<p><a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.address)}" target="_blank" rel="noopener">${esc(s.address)}</a></p>` : ''}${s.alternatives && s.alternatives.length ? `<p class="meta">Or ${esc(s.alternatives.map(a => typeof a === 'string' ? a : a.name).join(', '))}</p>` : ''}` : '';
  drawMap(); layoutPills();
  if (s) { const row = document.querySelector(`#list li[aria-current="true"]`); if (row && window.innerWidth > 760) row.scrollIntoView({ block: 'nearest' }); }
}
function select(id, fromList) {
  selected = selected === id ? null : id; render();
  const s = SEED.days[dayIdx].stops.find(x => x.id === selected);
  if (s && s.lat) { map.panTo([s.lat, s.lng], { animate: false }); if (window.innerWidth <= 760) map.panBy([0, window.innerHeight * .21], { animate: false }); layoutPills(); }
  if (s && window.innerWidth <= 760) { F('panel').scrollTo({ top: 0 }); }
}
document.addEventListener('click', e => {
  const d = e.target.closest('[data-day]'); if (d) { dayIdx = +d.dataset.day; selected = null; location.hash = dayIdx; render(); return; }
  const li = e.target.closest('#list li'); if (li) { select(li.dataset.id, true); return; }
  if (e.target.closest('#detail .close')) { selected = null; render(); return; }
});
/* phone sheet: drag between two heights */
(() => {
  const p = F('panel'); let y0 = null;
  p.addEventListener('touchstart', e => { y0 = e.touches[0].clientY; }, { passive: true });
  p.addEventListener('touchend', e => { if (y0 == null) return; const dy = e.changedTouches[0].clientY - y0; if (dy < -40) p.classList.add('tall'); if (dy > 40 && p.scrollTop <= 0) p.classList.remove('tall'); y0 = null; }, { passive: true });
  p.querySelector('.grip').addEventListener('click', () => p.classList.toggle('tall'));
})();
render();
</script>
</body>
</html>
