<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boston & Cambridge</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400&family=Schibsted+Grotesk:wght@400;600&display=swap">
<style>
/*{{LEAFLET_CSS}}*/
/* Layout: one crimson sheet, no seam. The day is a sentence on the left and the same day is a
   route on the right. One ground, one ink, like a one-color print. */
:root {
  --ground: #a51c30;
  --white: #ffffff;
  --serif: 'Newsreader', Georgia, serif;
  --sans: 'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--white); font-family: var(--serif); font-size: 19px; line-height: 1.4; overflow: hidden; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--white); outline-offset: 2px; }
p, ul, h2 { margin: 0; padding: 0; font-weight: 400; }
ul { list-style: none; }

#app { display: grid; grid-template-columns: minmax(380px, 40%) minmax(0, 1fr); height: 100%; }
#panel { min-width: 0; height: 100%; overflow-y: auto; overflow-x: hidden; display: grid; align-content: start; gap: 24px; scrollbar-width: thin; scrollbar-color: var(--white) transparent;
  padding-block: 22px 48px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
#panel > * { min-width: 0; }
#mapwrap { position: relative; min-width: 0; }
#map { position: absolute; inset: 0; background: var(--ground); }

.plain { display: flex; flex-wrap: wrap; gap: 2px 16px; font-family: var(--sans); font-size: 15px; }
.plain button, .plain a { min-height: 36px; display: inline-flex; align-items: center; text-decoration: none; }
.plain [aria-pressed="true"], .plain [aria-current="true"] { font-weight: 600; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }

.run { font-size: clamp(30px, 2.7vw, 40px); line-height: 1.2; }
.run a { text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 5px; }
.run a.done { text-decoration: line-through; text-decoration-thickness: 1.5px; }
.run a[aria-current="true"] { text-decoration: none; background: var(--white); color: var(--ground); }

.when { font-size: clamp(76px, 8vw, 116px); line-height: 1; }
.what { font-size: clamp(36px, 3.4vw, 50px); line-height: 1.1; text-wrap: balance; padding-top: 6px; }
.pager { display: flex; justify-content: space-between; gap: 12px; font-size: 26px; }
.pager button { min-height: 52px; min-width: 96px; }
.pager button:last-child { text-align: right; }

.list { display: grid; gap: 22px; }
.list h2 { font-family: var(--sans); font-size: 15px; font-weight: 600; padding-bottom: 2px; }
.tick { display: grid; grid-template-columns: 34px minmax(0, 1fr); align-items: start; font-size: 21px; line-height: 1.25; }
.dot { width: 34px; min-height: 36px; display: block; padding-top: 3px; cursor: pointer; }
.dot input { appearance: none; -webkit-appearance: none; display: block; width: 20px; height: 20px; margin: 0; border-radius: 50%; box-shadow: inset 0 0 0 2.5px var(--white); cursor: pointer; }
.dot input:checked { background: var(--white); }
.tick .txt { padding-block: 2px 8px; }
.tick a { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }
.tick a[aria-current="true"] { text-decoration: none; background: var(--white); color: var(--ground); }
.tick.on .txt, .tick.on a { text-decoration: line-through; }

.say { display: grid; gap: 6px; max-width: 62ch; }
#app.week { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
#app.week #mapwrap { display: none; }
#app.week .say { max-width: none; }
.week:not(#app) { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 32px 24px; }
.week h2 { font-size: 34px; line-height: 1.1; padding-bottom: 12px; }
.week li { font-size: 19px; line-height: 1.25; padding-bottom: 10px; }
.week a { text-decoration: none; }
.week a:hover { text-decoration: underline; text-underline-offset: 4px; }
.week a.done { text-decoration: line-through; }
.acts { padding-top: 4px; }
.say textarea, .sheet textarea, .sheet input, .sheet select { width: 100%; border: 0; border-radius: 0; background: var(--white); color: var(--ground); padding: 8px 10px; min-height: 44px; font-family: var(--serif); font-size: 17px; }
.sheet { display: grid; gap: 12px; max-width: 62ch; }
.sheet table { width: 100%; border-collapse: collapse; font-size: 17px; }
.sheet td, .sheet th { padding: 2px 0; text-align: left; vertical-align: top; font-weight: 400; }
.sheet td.n, .sheet th.n { text-align: right; white-space: nowrap; padding-left: 12px; font-variant-numeric: tabular-nums; }
.sheet h2 { font-family: var(--sans); font-size: 15px; font-weight: 600; padding-top: 6px; }
.check { display: flex; gap: 10px; align-items: flex-start; min-height: 40px; }
.check input { width: 20px; height: 20px; min-height: 0; margin: 4px 0 0; accent-color: var(--white); flex: 0 0 auto; }
.check.on span { text-decoration: line-through; }
.form { display: grid; gap: 10px; }
.form .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form label { font-family: var(--sans); font-size: 14px; display: grid; gap: 3px; }
.toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--white); color: var(--ground); padding: 6px 12px; font-family: var(--sans); font-size: 15px; z-index: 2000; pointer-events: none; opacity: 0; transition: opacity .2s; }
.toast.show { opacity: 1; }

/* map pieces */
.leaflet-container { background: var(--ground); font-family: var(--sans); }
.hit { width: 36px; height: 36px; display: grid; place-items: center; }
.pin { width: 20px; height: 20px; border-radius: 50%; background: var(--ground); box-shadow: 0 0 0 5px var(--white); display: block; }
.pin.mine { border-radius: 0; }
.pin.done { background: var(--white); width: 12px; height: 12px; }
.pin.active { width: 34px; height: 34px; background: var(--white); box-shadow: none; }
.lodge { width: 10px; height: 10px; background: var(--white); display: block; }
.leaflet-tooltip.lodge-label, .leaflet-tooltip.here { border: 0; border-radius: 0; box-shadow: none; padding: 1px 5px; }
.leaflet-tooltip.lodge-label { background: var(--ground); color: var(--white); font-family: var(--sans); font-size: 12px; white-space: nowrap; }
.leaflet-tooltip.here { background: var(--white); color: var(--ground); font-family: var(--serif); font-size: 17px; line-height: 1.2; white-space: normal; width: max-content; max-width: 230px; }
.leaflet-tooltip.lodge-label::before, .leaflet-tooltip.here::before { display: none; }
.leaflet-bar, .leaflet-touch .leaflet-bar { border: 0; border-radius: 0; box-shadow: none; }
.leaflet-bar a, .leaflet-bar a:hover, .leaflet-bar a.leaflet-disabled { background: var(--ground); color: var(--white); border: 0; border-radius: 0 !important; font-family: var(--sans); }
.leaflet-bar a.leaflet-disabled { visibility: hidden; }
.leaflet-touch .leaflet-bar a { width: 36px; height: 36px; line-height: 36px; }
.leaflet-container .leaflet-control-attribution { background: var(--ground); color: var(--white); font-size: 10px; }
.leaflet-control-attribution a { color: var(--white); }
#viewtoggle { display: none; }

@media (max-width: 760px) {
  body { font-size: 18px; }
  #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: 42% minmax(0, 1fr); }
  #app.full-map { grid-template-rows: minmax(0, 1fr) 0; }
  #app.full-panel { grid-template-rows: 0 minmax(0, 1fr); }
  #app.full-panel #mapwrap { overflow: hidden; }
  #mapwrap { order: 1; }
  #panel { order: 2; padding-top: 12px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); gap: 18px; }
  .run { font-size: 30px; }
  .when { font-size: 84px; }
  .what { font-size: 36px; }
  .form .row { grid-template-columns: 1fr; }
  #viewtoggle { display: block; position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); top: 8px; z-index: 900; min-height: 36px; padding: 0 8px; background: var(--ground); font-family: var(--sans); font-size: 15px; }
}
@media (pointer: coarse) { .leaflet-control-zoom { display: none; } }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

<div id="app">
  <aside id="panel">
    <nav class="plain" id="modes" aria-label="View"></nav>
    <nav class="plain" id="days" aria-label="Day"></nav>
    <div class="run" id="run"></div>
    <div class="say" id="say"></div>
    <nav class="plain" id="more" aria-label="More"></nav>
    <section class="sheet" id="sheet" hidden></section>
  </aside>
  <div id="mapwrap">
    <div id="map" role="application" aria-label="Trip map"></div>
    <button type="button" id="viewtoggle" aria-label="Switch between map and text">Map</button>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const SEED = /*{{SEED}}*/null;
const KEY = 'bostonTrip.v1';
const TYPES = ['food','cafe','bookstore','museum','walk','event','market','transit','lodging','cinema'];
const DAY_NAMES = ['Fri','Sat','Sun','Mon','Tue','Wed','Thu'];
const DAY_SLUGS = ['fri-30','sat-31','sun-1','mon-2','tue-3','wed-4','thu-5'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const SHEETS = [['day','This day'],['add','Add a stop'],['budget','Budget'],['rain','If it rains'],['data','Backup']];
const MODES = [['sentence','Sentence'],['one','One at a time'],['week','Week'],['list','Checklist']];
const MODE_HASH = { list: 'checklist', week: 'week' };
const MODE_WORD = { walk: 'walk', subway: 'by T', bus: 'by bus', ride: 'by Uber' };

/* ---------- user layer ---------- */
const blank = () => ({ version: 1, mode: 'sentence', addedStops: [], editedStops: {}, deletedStops: [], order: {}, stopNotes: {}, dayNotes: {}, done: {}, bookingsChecked: {} });
let U = blank();
try { const raw = localStorage.getItem(KEY); if (raw) U = Object.assign(blank(), JSON.parse(raw)); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(U)); } catch (e) {} };

/* ---------- merge ---------- */
function stopsFor(day) {
  const base = day.stops.map(s => Object.assign({}, s, U.editedStops[s.id] || {}, { mine: false }));
  const mine = U.addedStops.filter(a => a.date === day.date).map(a => Object.assign({ type: 'walk', cost: { amountUsd: 0 } }, a, { mine: true }));
  let all = base.concat(mine).filter(s => !U.deletedStops.includes(s.id));
  const ord = U.order[day.date];
  if (ord) {
    const rank = id => { const i = ord.indexOf(id); return i < 0 ? 1e6 : i; };
    all.sort((a, b) => rank(a.id) - rank(b.id) || (a.time || '').localeCompare(b.time || ''));
  }
  return all;
}
const costOf = s => Number((s.cost && s.cost.amountUsd) || 0);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const gmaps = s => s.lat ? `https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lng}` : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.address || s.name)}`;
const money = n => '$' + (Number.isInteger(n) ? n : n.toFixed(2));
const localYmd = () => { const t = new Date(); return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0'); };
const legMode = s => (s.legToNext && s.legToNext.mode) || 'walk';
const place = n => n.replace(/^(Coffee|Breakfast|Lunch|Brunch|Dinner|Dinner and last bookstore): /, '').replace(/ \(.*\)$/, '');
const dayTitle = d => { const t = d.title.split(': ')[1]; return t[0].toUpperCase() + t.slice(1); };
const shortDate = n => `${MONTHS[+n.slice(5, 7) - 1]} ${+n.slice(8)}`;
const F = id => document.getElementById(id);

/* ---------- state ---------- */
let dayIdx = 0;
let mode = U.mode || 'sentence';
let selected = null, sheet = null, noteOpen = false, askRemove = false, askReset = false;
let pickMode = false, pickLatLng = null, editingId = null;
let toastT; function toast(msg) { const t = F('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1800); }

(function pickInitialDay() {
  const today = SEED.days.findIndex(d => d.date === localYmd()); if (today >= 0) dayIdx = today;
  const hash = location.hash.replace('#', ''), hi = DAY_SLUGS.indexOf(hash);
  if (hash === 'checklist') mode = 'list';
  if (hash === 'week' || hash === 'all') mode = 'week';
  if (hi >= 0) { dayIdx = hi; if (MODE_HASH[mode]) mode = 'sentence'; }
})();
window.addEventListener('hashchange', () => {
  const hash = location.hash.replace('#', ''), hi = DAY_SLUGS.indexOf(hash);
  if (hash === 'checklist' && mode !== 'list') setMode('list');
  if ((hash === 'week' || hash === 'all') && mode !== 'week') setMode('week');
  if (hi < 0) return;
  if (MODE_HASH[mode]) setMode('sentence');
  if (hi !== dayIdx) setDay(hi);
});
function setDay(i) { dayIdx = i; selected = null; noteOpen = askRemove = false; location.hash = DAY_SLUGS[i]; render(); }
function setMode(m) {
  mode = m; U.mode = m; save(); selected = null; noteOpen = askRemove = false;
  location.hash = MODE_HASH[m] || DAY_SLUGS[dayIdx];
  render();
}

/* ---------- map ---------- */
const map = L.map('map', { zoomControl: true, attributionControl: true, zoomSnap: 1, maxZoom: 17, maxBoundsViscosity: 1 }).setView([42.362, -71.09], 12);
map.attributionControl.setPrefix('');

/* The city, printed in the same white as the text: whole × stitches for built-up land that keep
   clear of roads and rail, diagonal hatch for water, solid roads, ladder rail. */
const INK = '#ffffff', PAPER = '#a51c30', WHITE = '#ffffff';
const ROAD_W = { m: 3, k: 2.8, p: 2, s: 1.4, t: 1 };
const Stitch = L.GridLayer.extend({
  createTile(coords) {
    const c = document.createElement('canvas'), size = this.getTileSize(), dpr = Math.min(window.devicePixelRatio || 1, 2);
    c.width = size.x * dpr; c.height = size.y * dpr;
    const ctx = c.getContext('2d'); ctx.scale(dpr, dpr); ctx.fillStyle = PAPER; ctx.fillRect(0, 0, size.x, size.y);
    if (this.data) this.draw(ctx, coords, size.x);
    return c;
  },
  draw(ctx, coords, T) {
    const z = coords.z, scale = T * Math.pow(2, z), ox = coords.x * T, oy = coords.y * T, pad = 40;
    const X = lng => (lng + 180) / 360 * scale - ox;
    const Y = lat => { const r = lat * Math.PI / 180; return (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * scale - oy; };
    const lat = y => Math.atan(Math.sinh(Math.PI * (1 - 2 * y / scale))) * 180 / Math.PI;
    const west = (ox - pad) / scale * 360 - 180, east = (ox + T + pad) / scale * 360 - 180, north = lat(oy - pad), south = lat(oy + T + pad);
    const hit = f => !(f.b[2] < west || f.b[0] > east || f.b[3] < south || f.b[1] > north);
    const areas = (c, list) => { c.beginPath(); list.forEach(f => f.r.forEach(r => { r.forEach((p, i) => i ? c.lineTo(X(p[0]), Y(p[1])) : c.moveTo(X(p[0]), Y(p[1]))); c.closePath(); })); };
    const line = (c, p) => { c.beginPath(); p.forEach((q, i) => i ? c.lineTo(X(q[0]), Y(q[1])) : c.moveTo(X(q[0]), Y(q[1]))); c.stroke(); };
    const k = Math.pow(2, z - 14);
    const show = z >= 16 ? 'mkpst' : z >= 15 ? 'mkps' : z >= 14 ? 'mkp' : 'mk';
    const roads = this.data.roads.filter(f => show.includes(f.c) && hit(f));
    const rail = this.data.rail.filter(f => !f.u && hit(f));
    const water = this.data.water.filter(hit), built = this.data.builtup.filter(hit);
    const roadW = f => Math.max(1, Math.min(5, ROAD_W[f.c] * Math.pow(k, .6)));
    const railW = 1.2;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    // water hatch, aligned to world pixels so neighbouring tiles agree
    if (water.length) {
      ctx.save(); areas(ctx, water); ctx.clip('evenodd');
      const s = 8; ctx.strokeStyle = INK; ctx.lineWidth = 1; ctx.lineCap = 'butt'; ctx.beginPath();
      const d0 = Math.floor((ox + oy) / s) * s - (ox + oy);
      for (let d = d0; d < 2 * T + s; d += s) { ctx.moveTo(d + 10, -10); ctx.lineTo(d - T - 10, T + 10); }
      ctx.stroke(); ctx.restore(); ctx.lineCap = 'round';
    }

    // a mask decides which whole × stitches fit: inside built-up land, clear of roads and rail
    const g = 16, arm = 2.5, M = T + 2 * pad;
    const mask = this.mask || (this.mask = Object.assign(document.createElement('canvas'), { width: M, height: M }));
    const m = mask.getContext('2d', { willReadFrequently: true });
    m.setTransform(1, 0, 0, 1, pad, pad); m.clearRect(-pad, -pad, M, M);
    if (built.length) {
      m.fillStyle = '#fff'; areas(m, built); m.fill('evenodd');
      m.globalCompositeOperation = 'destination-out'; m.strokeStyle = '#000'; m.lineCap = 'round'; m.lineJoin = 'round';
      roads.forEach(f => { m.lineWidth = roadW(f) + 2 * arm + 7; line(m, f.p); });
      rail.forEach(f => { m.lineWidth = railW + 2 * arm + 14; line(m, f.p); });
      m.globalCompositeOperation = 'source-over';
      const px = m.getImageData(0, 0, M, M).data;
      ctx.strokeStyle = INK; ctx.lineWidth = 1.2; ctx.lineCap = 'butt'; ctx.beginPath();
      const x0 = Math.floor((ox - g) / g) * g - ox, y0 = Math.floor((oy - g) / g) * g - oy;
      for (let y = y0; y < T + g; y += g) for (let x = x0; x < T + g; x += g) {
        const cx = x + g / 2, cy = y + g / 2;
        const ix = Math.round(cx) + pad, iy = Math.round(cy) + pad;
        if (px[(iy * M + ix) * 4 + 3] < 128) continue;
        ctx.moveTo(cx - arm, cy - arm); ctx.lineTo(cx + arm, cy + arm); ctx.moveTo(cx + arm, cy - arm); ctx.lineTo(cx - arm, cy + arm);
      }
      ctx.stroke(); ctx.lineCap = 'round';
    }

    // rail and the T above ground: a line with ladder ticks, on a casing of the ground color
    if (z >= 12) {
      ctx.strokeStyle = PAPER; ctx.lineWidth = 11; rail.forEach(f => line(ctx, f.p));
      ctx.strokeStyle = INK; ctx.lineWidth = railW; rail.forEach(f => line(ctx, f.p));
      const step = 9, tick = 3.5, seen = new Set(); ctx.lineWidth = 1; ctx.lineCap = 'butt'; ctx.beginPath();
      rail.forEach(f => {
        // ticks restart from the way's start, so both tiles that see it place them identically
        let carry = 0;
        for (let i = 0; i < f.p.length - 1; i++) {
          const x1 = X(f.p[i][0]), y1 = Y(f.p[i][1]), x2 = X(f.p[i + 1][0]), y2 = Y(f.p[i + 1][1]), len = Math.hypot(x2 - x1, y2 - y1);
          if (!len) continue;
          const ux = (x2 - x1) / len, uy = (y2 - y1) / len;
          for (let d = carry; d < len; d += step) {
            const x = x1 + ux * d, y = y1 + uy * d, cell = Math.round((x + ox) / 7) + ':' + Math.round((y + oy) / 7);
            if (seen.has(cell)) continue; // parallel tracks share one set of ties
            seen.add(cell); ctx.moveTo(x - uy * tick, y + ux * tick); ctx.lineTo(x + uy * tick, y - ux * tick);
          }
          carry = (carry - len) % step; if (carry < 0) carry += step;
        }
      });
      ctx.stroke(); ctx.lineCap = 'round';
    }

    // roads: casing first so crossings over water and hatch stay clean, then ink
    ctx.strokeStyle = PAPER; roads.forEach(f => { ctx.lineWidth = roadW(f) + 5; line(ctx, f.p); });
    ctx.strokeStyle = INK; 'tspkm'.split('').forEach(c => roads.forEach(f => { if (f.c === c) { ctx.lineWidth = roadW(f); line(ctx, f.p); } }));
  }
});
const stitch = new Stitch({ tileSize: 256, updateWhenZooming: false, keepBuffer: 2, attribution: 'Map data &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' }).addTo(map);
let EDGE = null;
function fitLimits() {
  if (!EDGE) return;
  map.setMinZoom(map.getBoundsZoom(EDGE, true));
  map.setMaxBounds(EDGE);
}
fetch('basemap.json').then(r => r.json()).then(d => {
  const bb = pts => { let a = 180, b = 90, c = -180, e = -90; pts.forEach(p => { if (p[0] < a) a = p[0]; if (p[0] > c) c = p[0]; if (p[1] < b) b = p[1]; if (p[1] > e) e = p[1]; }); return [a, b, c, e]; };
  d.water.forEach(f => f.b = bb(f.r.flat())); d.builtup.forEach(f => f.b = bb(f.r.flat())); d.roads.forEach(f => f.b = bb(f.p)); d.rail.forEach(f => f.b = bb(f.p));
  EDGE = L.latLngBounds([d.bbox[1], d.bbox[0]], [d.bbox[3], d.bbox[2]]);
  fitLimits(); stitch.data = d; stitch.redraw();
}).catch(() => { toast('The map background did not load. The route still works.'); });

const routeLayer = L.layerGroup().addTo(map);
const lodgeLayer = L.layerGroup().addTo(map);
const stopLayer = L.layerGroup().addTo(map);
const markers = {};
let here = null;

SEED.lodging.forEach(l => {
  if (!l.lat) return;
  const short = l.name.replace('Royal ', '').replace(' Boston', '').replace(' House on Harvard', '');
  const icon = L.divIcon({ className: '', html: '<div class="hit"><i class="lodge"></i></div>', iconSize: [36, 36], iconAnchor: [18, 18] });
  const m = L.marker([l.lat, l.lng], { icon, keyboard: false }).addTo(lodgeLayer);
  m.bindTooltip(short, { permanent: true, direction: 'right', offset: [2, 0], className: 'lodge-label' });
  m.on('click', () => select('lodge:' + l.id, false));
});

map.on('click', e => {
  if (!pickMode) return;
  pickLatLng = e.latlng; pickMode = false;
  if (F('f-pickhint')) F('f-pickhint').textContent = `Pinned at ${e.latlng.lat.toFixed(4)}, ${e.latlng.lng.toFixed(4)}`;
  toast('Spot picked');
});

const allDays = () => mode === 'list';
function pinIcon(cls) {
  return L.divIcon({ className: '', html: `<div class="hit"><i class="pin ${cls}"></i></div>`, iconSize: [36, 36], iconAnchor: [18, 18] });
}

function drawMap() {
  stopLayer.clearLayers(); routeLayer.clearLayers();
  for (const k in markers) delete markers[k];
  const bounds = [];
  (allDays() ? SEED.days : [SEED.days[dayIdx]]).forEach(day => {
    const pts = [];
    stopsFor(day).forEach(s => {
      if (!s.lat) return;
      const cls = (s.mine ? 'mine ' : '') + (U.done[s.id] ? 'done' : '');
      const m = L.marker([s.lat, s.lng], { icon: pinIcon(cls), title: place(s.name) }).addTo(stopLayer);
      m.on('click', () => {
        select(s.id, false);
      });
      markers[s.id] = m;
      pts.push({ ll: [s.lat, s.lng], mode: legMode(s) });
      bounds.push([s.lat, s.lng]);
    });
    for (let i = 0; i < pts.length - 1; i++) {
      // a band of the ground color lifts the route off the printed city
      L.polyline([pts[i].ll, pts[i + 1].ll], { color: PAPER, weight: 18, opacity: 1, lineCap: 'round', interactive: false }).addTo(routeLayer);
      L.polyline([pts[i].ll, pts[i + 1].ll], { color: WHITE, weight: 6, opacity: 1, dashArray: pts[i].mode === 'walk' ? null : '1 12', lineCap: 'round', interactive: false }).addTo(routeLayer);
    }
  });
  if (bounds.length) map.fitBounds(bounds, { padding: [56, 56], maxZoom: 15, animate: false });
}

function markHere(s) {
  if (here) { here.remove(); here = null; }
  document.querySelectorAll('.pin.active').forEach(el => el.classList.remove('active'));
  if (!s || !s.lat) return;
  const m = markers[s.id];
  const el = m && m.getElement() && m.getElement().querySelector('.pin');
  if (el) { el.classList.add('active'); m.setZIndexOffset(1000); }
  here = L.tooltip({ permanent: true, direction: 'auto', offset: [24, 0], opacity: 1, className: 'here' }).setLatLng([s.lat, s.lng]).setContent(esc(place(s.name))).addTo(map);
}

/* ---------- panel ---------- */
const dayStops = () => stopsFor(SEED.days[dayIdx]);
const anyStop = id => SEED.days.flatMap(stopsFor).find(s => s.id === id) || null;
const focusStop = () => mode === 'list' ? (selected ? anyStop(selected) : null) : (currentLodge() ? null : current());
const current = () => { const list = dayStops(); return list.find(s => s.id === selected) || (selected && String(selected).startsWith('lodge:') ? null : list[0]) || null; };
const currentLodge = () => selected && String(selected).startsWith('lodge:') ? SEED.lodging.find(l => 'lodge:' + l.id === selected) : null;

function renderDays() {
  const today = localYmd();
  F('modes').innerHTML = MODES.map(([k, label]) => `<button type="button" data-mode="${k}" aria-pressed="${mode === k}">${label}</button>`).join('');
  F('days').hidden = !!MODE_HASH[mode];
  F('days').innerHTML = SEED.days.map((d, i) => `<button type="button" data-day="${i}" aria-pressed="${i === dayIdx}"${d.date === today ? ' aria-label="Today, ' + DAY_NAMES[i] + ' ' + (+d.date.slice(8)) + '"' : ''}>${DAY_NAMES[i]} ${+d.date.slice(8)}</button>`).join('');
}

function renderRun() {
  if (mode === 'list') {
    const stops = SEED.days.flatMap(stopsFor);
    const done = stops.filter(s => U.done[s.id]).length + SEED.bookings.filter(b => U.bookingsChecked[b.id]).length;
    F('run').textContent = `${done} of ${stops.length + SEED.bookings.length} done.`;
    return;
  }
  if (mode === 'week') {
    F('run').textContent = `Oct 30 to Nov 5, ${SEED.days.flatMap(stopsFor).length} stops.`;
    return;
  }
  if (mode === 'one') {
    const s = current(), lodge = currentLodge();
    F('run').innerHTML = lodge ? `<div class="what">${esc(lodge.name)}</div>` : s ? `<div class="when">${esc(s.time || '')}</div><div class="what">${esc(place(s.name))}</div>` : '';
    return;
  }
  const cur = current();
  F('run').innerHTML = dayStops().map(s => `${esc(s.time || '')} <a href="#${DAY_SLUGS[dayIdx]}" data-stop="${esc(s.id)}"${U.done[s.id] ? ' class="done"' : ''}${cur && s.id === cur.id ? ' aria-current="true"' : ''}>${esc(place(s.name))}</a>`).join(', ') + '.';
}

function renderChecklist() {
  const row = (id, attr, on, body, label) => `<li class="tick${on ? ' on' : ''}"><label class="dot"><input type="checkbox" id="tick-${esc(id)}" ${attr}="${esc(id)}" ${on ? 'checked' : ''} aria-label="${esc(label)}"></label><div class="txt">${body}</div></li>`;
  const book = `<section><h2>To book</h2><ul>${SEED.bookings.map(b => row(b.id, 'data-book', !!U.bookingsChecked[b.id], esc(b.text), b.text)).join('')}</ul></section>`;
  const days = SEED.days.map((d, i) => `<section><h2>${DAY_NAMES[i]} ${+d.date.slice(8)}</h2><ul>${stopsFor(d).map(s => row(s.id, 'data-tick', !!U.done[s.id], `${esc(s.time || '')} <a href="#checklist" data-row="${esc(s.id)}"${s.id === selected ? ' aria-current="true"' : ''}>${esc(place(s.name))}</a>`, place(s.name))).join('')}</ul></section>`).join('');
  return `<div class="list">${book}${days}</div>`;
}

function advance(dir) {
  F('panel').scrollTop = 0;
  const list = dayStops(), cur = current(), i = cur ? list.findIndex(s => s.id === cur.id) : -1;
  if (!cur) return select(list[0] ? list[0].id : null, true);
  const next = list[i + dir];
  if (next) return select(next.id, true);
  const day = dayIdx + dir;
  if (day < 0 || day > 6) return;
  const stops = stopsFor(SEED.days[day]);
  dayIdx = day; selected = stops.length ? stops[dir > 0 ? 0 : stops.length - 1].id : null; noteOpen = askRemove = false;
  location.hash = DAY_SLUGS[day]; render();
}

function renderSay() {
  const el = F('say'), lodge = currentLodge();
  if (mode === 'list') { el.innerHTML = renderChecklist(); return; }
  if (mode === 'week') {
    el.innerHTML = `<div class="week">${SEED.days.map((d, i) => `<section><h2>${DAY_NAMES[i]} ${+d.date.slice(8)}</h2><ul>${stopsFor(d).map(s => `<li><a href="#${DAY_SLUGS[i]}" data-week="${esc(s.id)}" data-index="${i}"${U.done[s.id] ? ' class="done"' : ''}>${esc(s.time || '')} ${esc(place(s.name))}</a></li>`).join('')}</ul></section>`).join('')}</div>`;
    return;
  }
  if (lodge) {
    el.innerHTML = `<p>${esc(lodge.name)}, nights of ${shortDate(lodge.nights[0])} to ${shortDate(lodge.nights[lodge.nights.length - 1])}.</p><p>In ${esc(lodge.checkIn)}, out ${esc(lodge.checkOut)}.</p><p><a href="${gmaps(lodge)}" target="_blank" rel="noopener">${esc(lodge.address)}</a></p>`;
    return;
  }
  const s = current();
  if (!s) { el.innerHTML = '<p>Nothing planned here. Add a stop below.</p>'; return; }
  const list = dayStops(), i = list.findIndex(x => x.id === s.id);
  const costTxt = (s.cost && s.cost.label) || (costOf(s) ? money(costOf(s)) : '');
  const leg = s.legToNext ? s.legToNext.text : '';
  const after = list[i + 1], one = mode === 'one';
  const lastDay = dayIdx === 6 && !after, firstDay = dayIdx === 0 && i === 0;
  const nextLine = after ? `Next: ${esc(place(after.name))}${s.legToNext ? `, ${s.legToNext.minutes} min ${MODE_WORD[s.legToNext.mode]}` : ''}` : (lastDay ? 'Last stop of the trip.' : 'Last stop of the day.');
  el.innerHTML = `${!one && s.name !== place(s.name) ? `<p>${esc(s.name)}</p>` : ''}
    ${s.why ? `<p>${esc(s.why)}</p>` : ''}${s.note ? `<p>${esc(s.note)}</p>` : ''}
    ${costTxt ? `<p>${esc(costTxt)}${s.cost && s.cost.payAhead ? ', book ahead' : ''}</p>` : ''}
    ${(s.alternatives || []).map(a => `<p>Or ${esc(a.name)}. ${esc(a.why || '')}</p>`).join('')}
    ${leg && !one ? `<p>Then: ${esc(leg)}</p>` : ''}
    ${s.address ? `<p><a href="${gmaps(s)}" target="_blank" rel="noopener">${esc(s.address)}</a></p>` : ''}
    ${!s.lat ? `<p>${s.mine ? 'No spot on the map yet. Choose Edit to pick one.' : 'No address yet, so it is not on the map.'}</p>` : ''}
    ${one ? `<p>${nextLine}</p><div class="pager"><button type="button" data-step="-1"${firstDay ? ' hidden' : ''}>Back</button><button type="button" data-step="1"${lastDay ? ' hidden' : ''}>${after ? 'Next' : 'Next day'}</button></div>` : ''}
    <div class="plain acts">
      <button type="button" data-act="done">${U.done[s.id] ? 'Not done' : 'Done'}</button>
      <button type="button" data-act="note">Note</button>
      ${i > 0 ? '<button type="button" data-act="earlier">Earlier</button>' : ''}
      ${i < list.length - 1 ? '<button type="button" data-act="later">Later</button>' : ''}
      ${s.mine ? '<button type="button" data-act="edit">Edit</button>' : ''}
      <button type="button" data-act="remove">Remove</button>
    </div>
    ${askRemove ? `<div class="plain"><span>Remove this stop?</span><button type="button" data-act="remove-yes">Yes, remove</button><button type="button" data-act="remove-no">Keep it</button></div>` : ''}
    ${noteOpen || U.stopNotes[s.id] ? `<textarea id="stop-note" rows="2" aria-label="Your note on this stop" placeholder="Your note">${esc(U.stopNotes[s.id] || '')}</textarea>` : ''}`;
  const t = F('stop-note');
  if (t) t.oninput = e => { const v = e.target.value; if (v.trim()) U.stopNotes[s.id] = v; else delete U.stopNotes[s.id]; save(); };
}

function renderMore() {
  F('more').innerHTML = SHEETS.filter(([k]) => k !== 'day' || !MODE_HASH[mode]).map(([k, label]) => `<button type="button" data-sheet="${k}" aria-pressed="${sheet === k}">${label}</button>`).join('');
}

function renderSheet() {
  const el = F('sheet'); el.hidden = !sheet; if (!sheet) { el.innerHTML = ''; return; }
  if (sheet === 'day') {
    if (MODE_HASH[mode]) { sheet = null; return renderSheet(); }
    const day = SEED.days[dayIdx];
    const mine = dayStops().filter(s => s.mine).reduce((a, s) => a + costOf(s), 0);
    const deleted = day.stops.filter(s => U.deletedStops.includes(s.id));
    el.innerHTML = `<p>${esc(day.summary)}</p><p>${esc(day.spend)}${mine ? ', plus ' + money(mine) + ' of yours' : ''}.</p>
      <div class="plain"><a href="${day.routeUrl}" target="_blank" rel="noopener">Open route in Google Maps</a></div>
      ${deleted.length ? `<div class="plain">${deleted.map(s => `<button type="button" data-restore="${esc(s.id)}">Put back ${esc(place(s.name))}</button>`).join('')}</div>` : ''}
      <textarea id="day-note" rows="3" aria-label="Notes for this day" placeholder="Notes for this day">${esc(U.dayNotes[day.date] || '')}</textarea>`;
    F('day-note').oninput = e => { const v = e.target.value; if (v.trim()) U.dayNotes[day.date] = v; else delete U.dayNotes[day.date]; save(); };
  }
  if (sheet === 'add') {
    const s = editingId ? U.addedStops.find(a => a.id === editingId) : null;
    const date = s ? s.date : SEED.days[dayIdx].date;
    el.innerHTML = `<form class="form" id="addform" autocomplete="off">
      <label>Name<input id="f-name" required maxlength="80" value="${esc(s ? s.name : '')}"></label>
      <div class="row"><label>Day<select id="f-day">${SEED.days.map((d, i) => `<option value="${d.date}"${d.date === date ? ' selected' : ''}>${DAY_NAMES[i]} ${+d.date.slice(8)}</option>`).join('')}</select></label>
      <label>Time<input id="f-time" type="time" value="${esc(s ? s.time : '')}"></label></div>
      <div class="row"><label>Type<select id="f-type">${TYPES.map(t => `<option${s && s.type === t ? ' selected' : ''}>${t}</option>`).join('')}</select></label>
      <label>Cost in USD<input id="f-cost" type="number" min="0" step="0.5" inputmode="decimal" value="${s && costOf(s) ? costOf(s) : ''}"></label></div>
      <label>Address<input id="f-addr" maxlength="140" value="${esc(s ? s.address : '')}"></label>
      <div class="plain"><button type="button" id="f-pick">Pick the spot on the map</button><span id="f-pickhint">${pickLatLng ? `Pinned at ${pickLatLng.lat.toFixed(4)}, ${pickLatLng.lng.toFixed(4)}` : ''}</span></div>
      <label>Why or a note<textarea id="f-note" rows="2">${esc(s ? s.note : '')}</textarea></label>
      <div class="plain"><button type="submit">${s ? 'Save changes' : 'Add this stop'}</button>${s ? '<button type="button" id="f-cancel">Cancel</button>' : ''}</div></form>`;
    F('f-pick').onclick = () => { pickMode = true; F('f-pickhint').textContent = 'Now tap the map where it is'; F('app').classList.remove('full-panel'); map.invalidateSize(); };
    if (F('f-cancel')) F('f-cancel').onclick = () => { editingId = null; pickLatLng = null; renderSheet(); };
    F('addform').onsubmit = submitStop;
  }
  if (sheet === 'budget') {
    const acts = [];
    SEED.days.forEach((d, i) => stopsFor(d).forEach(s => { if (costOf(s)) acts.push({ item: `${DAY_NAMES[i]}: ${place(s.name)}`, amountUsd: costOf(s), mine: s.mine }); }));
    const total = acts.reduce((a, x) => a + x.amountUsd, 0);
    const tLow = SEED.budget.transport.reduce((a, x) => a + x.lowUsd, 0), tHigh = SEED.budget.transport.reduce((a, x) => a + x.highUsd, 0);
    el.innerHTML = `<p>${esc(SEED.budget.notes)}</p>
      <h2>Priced stops</h2><table><tbody>${acts.map(a => `<tr><td>${esc(a.item)}${a.mine ? ', yours' : ''}</td><td class="n">${money(a.amountUsd)}</td></tr>`).join('')}<tr><td>Total</td><td class="n">${money(total)}</td></tr></tbody></table>
      <h2>Paid activities, as planned</h2><table><tbody>${SEED.budget.activities.map(a => `<tr><td>${esc(a.item)}</td><td class="n">${money(a.amountUsd)}</td></tr>`).join('')}</tbody></table>
      <h2>Transport</h2><table><thead><tr><th></th><th class="n">Low</th><th class="n">High</th></tr></thead><tbody>${SEED.budget.transport.map(t => `<tr><td>${esc(t.item)}</td><td class="n">${money(t.lowUsd)}</td><td class="n">${money(t.highUsd)}</td></tr>`).join('')}<tr><td>Total</td><td class="n">${money(tLow)}</td><td class="n">${money(tHigh)}</td></tr></tbody></table>`;
  }
  if (sheet === 'rain') el.innerHTML = `<ul class="sheet">${SEED.swaps.map(s => `<li>${esc(s)}</li>`).join('')}</ul>`;
  if (sheet === 'data') {
    el.innerHTML = `<p>Your stops, notes and ticks are saved in this browser. Copy them to keep a backup or move them to another phone.</p>
      <div class="plain"><button type="button" id="io-export">Copy my data</button><button type="button" id="io-import">Restore from the text below</button><button type="button" id="io-reset">Go back to the original plan</button></div>
      ${askReset ? '<div class="plain"><span>This deletes everything you added.</span><button type="button" id="io-yes">Yes, go back</button><button type="button" id="io-no">Keep my data</button></div>' : ''}
      <textarea id="io-text" rows="5" aria-label="Your data as text" placeholder="Paste a backup here"></textarea><p id="io-err"></p>`;
    F('io-export').onclick = () => {
      const txt = JSON.stringify(U, null, 2); F('io-text').value = txt;
      const fallback = () => { F('io-text').focus(); F('io-text').select(); toast('Select the text and copy it'); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => toast('Copied'), fallback); else fallback();
    };
    F('io-import').onclick = () => {
      try { const obj = JSON.parse(F('io-text').value); if (!obj || typeof obj !== 'object' || !('addedStops' in obj)) throw new Error('That text is not a backup from this page.'); U = Object.assign(blank(), obj); mode = U.mode || 'sentence'; save(); render(); toast('Restored'); }
      catch (err) { F('io-err').textContent = 'Could not restore it. ' + err.message; }
    };
    F('io-reset').onclick = () => { askReset = true; renderSheet(); };
    if (askReset) {
      F('io-no').onclick = () => { askReset = false; renderSheet(); };
      F('io-yes').onclick = () => { U = blank(); mode = 'sentence'; askReset = false; save(); render(); toast('Back to the original plan'); };
    }
  }
}

function submitStop(e) {
  e.preventDefault();
  const editing = editingId, cost = F('f-cost').value;
  const stop = { id: editing || ('user-' + Date.now().toString(36)), date: F('f-day').value, time: F('f-time').value, name: F('f-name').value.trim(), type: F('f-type').value, address: F('f-addr').value.trim(), cost: { amountUsd: Number(cost) || 0, label: cost ? money(Number(cost)) : '' }, note: F('f-note').value.trim(), lat: pickLatLng ? pickLatLng.lat : null, lng: pickLatLng ? pickLatLng.lng : null };
  if (editing) { const i = U.addedStops.findIndex(a => a.id === editing); if (i >= 0) U.addedStops[i] = stop; else U.addedStops.push(stop); }
  else U.addedStops.push(stop);
  save();
  dayIdx = SEED.days.findIndex(d => d.date === stop.date); location.hash = DAY_SLUGS[dayIdx];
  selected = stop.id; editingId = null; pickLatLng = null; sheet = null; render();
  toast(editing ? 'Saved' : 'Added to ' + DAY_NAMES[dayIdx]);
}

function select(id, pan) {
  selected = id; noteOpen = askRemove = false;
  renderRun(); renderSay();
  const s = focusStop();
  markHere(s);
  if (mode === 'list' && !pan) { const row = document.querySelector(`[data-row="${id}"]`); if (row) row.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
  if (pan && s && s.lat) { if (mode === 'one') map.panTo([s.lat, s.lng]); else map.panInside([s.lat, s.lng], { padding: [70, 70] }); }
}

function move(s, dir) {
  const ids = dayStops().map(x => x.id), i = ids.indexOf(s.id), j = i + dir;
  if (j < 0 || j >= ids.length) return;
  [ids[i], ids[j]] = [ids[j], ids[i]]; U.order[SEED.days[dayIdx].date] = ids; save(); render();
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-mode],[data-day],[data-stop],[data-row],[data-week],[data-step],[data-sheet],[data-act],[data-restore]'); if (!b) return;
  const d = b.dataset;
  if (d.stop || d.row || d.week) e.preventDefault();
  if (d.mode) setMode(d.mode);
  else if (d.week) { mode = U.mode = 'sentence'; save(); dayIdx = +d.index; selected = d.week; location.hash = DAY_SLUGS[dayIdx]; render(); }
  else if (d.step) advance(+d.step);
  else if (d.row) select(d.row, true);
  else if (d.day) setDay(+d.day);
  else if (d.stop) select(d.stop, true);
  else if (d.sheet) { sheet = sheet === d.sheet ? null : d.sheet; if (sheet !== 'add') { editingId = null; pickLatLng = null; pickMode = false; } renderMore(); renderSheet(); }
  else if (d.restore) { U.deletedStops = U.deletedStops.filter(x => x !== d.restore); save(); render(); }
  else if (d.act) {
    const s = current(); if (!s) return;
    if (d.act === 'done') { if (U.done[s.id]) delete U.done[s.id]; else U.done[s.id] = true; save(); selected = s.id; render(); }
    if (d.act === 'note') { noteOpen = !noteOpen; renderSay(); if (F('stop-note')) F('stop-note').focus(); }
    if (d.act === 'earlier') { selected = s.id; move(s, -1); }
    if (d.act === 'later') { selected = s.id; move(s, 1); }
    if (d.act === 'edit') { editingId = s.id; pickLatLng = s.lat ? { lat: s.lat, lng: s.lng } : null; sheet = 'add'; renderMore(); renderSheet(); F('sheet').scrollIntoView({ behavior: 'smooth' }); }
    if (d.act === 'remove') { askRemove = true; renderSay(); }
    if (d.act === 'remove-no') { askRemove = false; renderSay(); }
    if (d.act === 'remove-yes') { if (s.mine) U.addedStops = U.addedStops.filter(a => a.id !== s.id); else U.deletedStops.push(s.id); askRemove = false; selected = null; save(); render(); toast('Removed'); }
  }
});

document.addEventListener('change', e => {
  const t = e.target, id = t.dataset.tick, book = t.dataset.book;
  if (!id && !book) return;
  const store = id ? U.done : U.bookingsChecked, key = id || book;
  if (t.checked) store[key] = true; else delete store[key];
  save(); t.closest('.tick').classList.toggle('on', t.checked); renderRun();
  const pin = id && markers[id] && markers[id].getElement() && markers[id].getElement().querySelector('.pin');
  if (pin) pin.classList.toggle('done', t.checked);
});

document.addEventListener('keydown', e => {
  if (mode !== 'one' || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (e.key === 'ArrowRight') advance(1);
  if (e.key === 'ArrowLeft') advance(-1);
});
let touch = null;
F('panel').addEventListener('touchstart', e => { touch = e.touches[0]; }, { passive: true });
F('panel').addEventListener('touchend', e => {
  if (mode !== 'one' || !touch) return;
  const t = e.changedTouches[0], dx = t.clientX - touch.clientX, dy = t.clientY - touch.clientY; touch = null;
  if (Math.abs(dx) > 60 && Math.abs(dy) < 50) advance(dx < 0 ? 1 : -1);
}, { passive: true });

/* ---------- phone view toggle ---------- */
const app = F('app'), vt = F('viewtoggle');
const VIEWS = ['', 'full-map', 'full-panel']; let vi = 0;
const resized = () => { map.invalidateSize(); fitLimits(); };
vt.onclick = () => { vi = (vi + 1) % 3; app.classList.remove('full-map', 'full-panel'); if (VIEWS[vi]) app.classList.add(VIEWS[vi]); vt.textContent = ['Map', 'Text', 'Both'][vi]; setTimeout(resized, 50); };
window.addEventListener('resize', resized);

function render() {
  app.classList.toggle('week', mode === 'week');
  renderDays(); renderRun(); renderSay(); renderMore(); renderSheet();
  if (mode === 'week') return;
  resized(); drawMap(); markHere(focusStop());
}
render();
</script>
